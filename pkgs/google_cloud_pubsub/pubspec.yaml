name: google_cloud_pubsub
description: >-
  Google Cloud Pub/Sub, a flexible, reliable, large-scale messaging
  service
version: 0.1.0-wip
repository: https://github.com/googleapis/google-cloud-dart/tree/main/pkgs/google_cloud_pubsub
issue_tracker: https://github.com/googleapis/google-cloud-dart/issues

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  ffi: ^2.2.0
  fixnum: ^1.1.1
  google_cloud_rpc: ^0.6.0
  grpc: ^5.1.0
  meta: ^1.18.1
  protobuf: ^6.0.0

dev_dependencies:
  build_runner: ^2.15.1
  build_version: ^2.0.0
  http: ^1.6.0
  protoc_plugin: ^25.0.0
  test: ^1.24.0
