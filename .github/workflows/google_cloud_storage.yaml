permissions:
  contents: read

# Run on PRs and pushes to the default branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DART_VERSION: 3.9.2

name: Google Cloud Storage

jobs:
  check_version:
    name: Check version.dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1
        with:
          sdk: ${{ env.DART_VERSION }}
      - name: Cache Pub Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - run: dart pub get
      - name: Build version.dart
        working-directory: pkgs/google_cloud_storage
        run: dart run build_runner build
      - name: Verify version.dart matches pubspec.yaml
        run: git diff --exit-code pkgs/google_cloud_storage/lib/src/version.dart
      - name: Print diff on failure
        if: failure()
        run: git diff pkgs/google_cloud_storage/lib/src/version.dart
