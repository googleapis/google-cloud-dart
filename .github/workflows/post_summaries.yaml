name: Comment on the pull request
permissions:
  contents: read

on:
  # Trigger this workflow after the Health or Publish workflow completes. This
  # workflow will have permissions to create comments on the PR, even if the
  # original workflow ran on a fork PR.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Publish
      - Health
    types:
      - completed

jobs:
  upload:
    if: ${{ github.repository_owner == 'googleapis' }}
    uses: dart-lang/ecosystem/.github/workflows/post_summaries.yaml@main
    permissions:
      pull-requests: write
