permissions:
  contents: read

# Run on PRs and pushes to the default branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# We use a specific Dart SDK version here in order to have hermetic,
# reproducible formatting (formatting can change between SDK versions, ...).
env:
  FORMAT_DART_VERSION: 3.13.2
  GOOGLE_CLOUD_PROJECT: test-project
name: Dart Checks
jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1
        with:
          sdk: ${{ env.FORMAT_DART_VERSION }}
      - name: Cache Pub Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ env.FORMAT_DART_VERSION }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ env.FORMAT_DART_VERSION }}-
            ${{ runner.os }}-pub-
      - run: dart pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Verify Code Excerpts Up-to-Date
        run: dart run tool/update_excerpts.dart --fail-on-update

  analyze:
    name: Analyze (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [3.10.0, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Cache Pub Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ matrix.sdk }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ matrix.sdk }}-
            ${{ runner.os }}-pub-
      - run: dart pub get
      - name: Analyze
        run: dart analyze

  unit_tests:
    name: Unit Tests (${{ matrix.sdk }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [3.10.0, stable]
        platform: ["chrome", "vm"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart test -p ${{ matrix.platform }} .

  storage_testbench_tests:
    name: Storage Testbench Tests (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [3.10.0, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: docker run -d --rm -p 9000:9000 -p 8888:8888 gcr.io/cloud-devrel-public-resources/storage-testbench:latest
      - run: dart test -P storage-testbench .

  firestore_emulator_tests:
    name: Firestore Emulator Tests (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [3.10.0, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'zulu'
          java-version: '25'
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Run Tests
        run: firebase emulators:exec --config=firestore_emulators/firebase.json \
          "dart test -P firebase-emulator ."
