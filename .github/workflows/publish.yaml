# A CI configuration to auto-publish pub packages.

name: Publish
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
  push:
    tags: [ '[A-z]+-v[0-9]+.[0-9]+.[0-9]+*' ]

jobs:
  publish:
    if: ${{ github.repository_owner == 'googleapis' }}
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@1d2b5ff862c6b93cd86dd06eadac4c9f4d5d6c20
    with:
      ignore-packages: generated/**
      write-comments: false
    permissions:
      id-token: write
      pull-requests: write

  stage-exit-gate:
    if: ${{ github.repository_owner == 'googleapis' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Clean up previous staging attempt for this version (if any)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PKG_NAME="${TAG_NAME%-v*}"
          VERSION="${TAG_NAME##*-v}"
          if gcloud artifacts versions describe "${VERSION}" \
            --package="${PKG_NAME}" \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="google-cloud-dart--pubdev" >/dev/null 2>&1; then
            gcloud artifacts versions delete "${VERSION}" \
              --package="${PKG_NAME}" \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="google-cloud-dart--pubdev" \
              --quiet
          fi

      - name: Stage package archive and trigger OSS Exit Gate release
        env:
          TAG_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          PKG_NAME="${TAG_NAME%-v*}"
          VERSION="${TAG_NAME##*-v}"
          if [ -d "pkgs/${PKG_NAME}" ]; then
            PKG_DIR="pkgs/${PKG_NAME}"
          elif [ -d "generated/${PKG_NAME}" ]; then
            PKG_DIR="generated/${PKG_NAME}"
          else
            echo "Package directory for ${PKG_NAME} not found"
            exit 1
          fi
          ARCHIVE="${PKG_NAME}-${VERSION}.tar.gz"
          tar -czf "${ARCHIVE}" -C "${PKG_DIR}" .
          gcloud artifacts generic upload \
            --project=oss-exit-gate-prod \
            --location=us \
            --repository=google-cloud-dart--pubdev \
            --package="${PKG_NAME}" \
            --version="${VERSION}" \
            --source="${ARCHIVE}"
          cat <<EOF > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "packages": [
                  {
                    "name": "${PKG_NAME}",
                    "version": "${VERSION}"
                  }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/google-cloud-dart/pubdev/manifests/manifest-${PKG_NAME}-${VERSION}-${RUN_ID}-${RUN_ATTEMPT}.json"
