# A CI configuration to auto-publish pub packages.

name: Publish
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
  push:
    tags: [ '[A-z]+-v[0-9]+.[0-9]+.[0-9]+*' ]

jobs:
  publish:
    if: ${{ github.repository_owner == 'googleapis' }}
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@622ef61a7edd5de7df38661e163e55c57606c96a
    with:
      ignore-packages: generated/**
      write-comments: false
    permissions:
      id-token: write
      pull-requests: write

  stage-exit-gate:
    if: ${{ github.repository_owner == 'googleapis' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Stage package archive and trigger OSS Exit Gate release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PKG_NAME="${TAG_NAME%-v*}"
          VERSION="${TAG_NAME##*-v}"
          if [ -d "pkgs/${PKG_NAME}" ]; then
            PKG_DIR="pkgs/${PKG_NAME}"
          elif [ -d "generated/${PKG_NAME}" ]; then
            PKG_DIR="generated/${PKG_NAME}"
          else
            echo "Package directory for ${PKG_NAME} not found"
            exit 1
          fi
          ARCHIVE="${PKG_NAME}-${VERSION}.tar.gz"
          tar -czf "${ARCHIVE}" -C "${PKG_DIR}" .
          gcloud artifacts generic upload \
            --project=oss-exit-gate-prod \
            --location=us \
            --repository=google-cloud-dart--pubdev \
            --package="${PKG_NAME}" \
            --version="${VERSION}" \
            --source="${ARCHIVE}"
          cat <<EOF > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "packages": [
                  {
                    "name": "${PKG_NAME}",
                    "version": "${VERSION}"
                  }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/google-cloud-dart/pubdev/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
